<title>Звідки ми? — база для організаторів</title>

<style>
:root{--bg:#0b0d10;--card:#161a20;--line:#252b34;--text:#e6edf5;--mute:#8a96a6;--acc:#b6ff3b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 Manrope,system-ui,sans-serif;padding:16px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--mute);margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
input,select,button{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
button{cursor:pointer}button.p{background:var(--acc);color:#0b0d10;border-color:var(--acc);font-weight:600}
label.c{display:flex;align-items:center;gap:6px;color:var(--mute)}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--mute);cursor:pointer}
.chip b{color:var(--acc)}
.wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--card);cursor:pointer;white-space:nowrap;user-select:none}
th.s::after{content:" ▲"}th.s.d::after{content:" ▼"}
td img{width:56px;height:56px;object-fit:cover;border-radius:6px;display:block;cursor:zoom-in}
.mute{color:var(--mute)}td.ap{color:var(--mute);font-style:italic}
#lb{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9}
#lb img{max-width:92vw;max-height:92vh;border-radius:8px}
</style>

}
const cityText=r=>(r.exact?"":"≈ ")+r.city+(r.dist>3?` (${Math.round(r.dist)} км)`:"");
const photo=(p,t)=>sb.storage.from(BUCKET).getPublicUrl(t?p.replace(/\.jpg$/,"_t.jpg"):p).data.publicUrl;

async function load(){
  $("#st").textContent="Завантаження…";
  let {data:{session}}=await sb.auth.getSession();
  if(!session){const r=await sb.auth.signInAnonymously();if(r.error)throw r.error}
  const g=await sb.rpc("get_pins_v2");if(g.error)throw g.error;
  rows=(g.data||[]).map((p,n)=>{
    const ll=toLL(p),k=ll.lat.toFixed(3)+","+ll.lon.toFixed(3),c=cache[k],b=nearBig(ll.lat,ll.lon);
    return{i:n+1,lat:ll.lat,lon:ll.lon,fact:p.fact||"",path:p.photo_path||"",oblast:oblastOf(p),
      city:c?c.city:b.city,dist:c?c.dist:b.dist,exact:!!c};
  });
  render();resolveAll();
}
function view(){
  const q=$("#fq").value.trim().toLowerCase();
  let v=rows.filter(r=>(!oblastPick||r.oblast===oblastPick)
    &&(!$("#fp").checked||r.path)&&(!$("#ff").checked||r.fact.trim())
    &&(!q||(cityText(r)+" "+r.oblast+" "+r.fact).toLowerCase().includes(q)));
  v.sort((a,b)=>{
    const x=a[sortK],y=b[sortK];
    let c=typeof x==="number"?x-y:String(x).localeCompare(String(y),"uk");
    if(!c)c=String(a.city).localeCompare(String(b.city),"uk");
    return sortD?-c:c;
  });
  return v;
}
function render(){
  const v=view();
  $("#st").textContent=`Усього пінів: ${rows.length} · показано: ${v.length}`+(rows.some(r=>!r.exact)?` · уточнено населених пунктів: ${rows.filter(r=>r.exact).length} з ${rows.length}`:" · усе уточнено");
  // області
  const cnt={};rows.forEach(r=>{const o=r.oblast||"(невизначено)";cnt[o]=(cnt[o]||0)+1});
  const names=Object.keys(cnt).sort((a,b)=>a.localeCompare(b,"uk"));
  const fo=$("#fo"),cur=fo.value;
  fo.innerHTML='<option value="">Усі області</option>'+names.map(n=>`<option ${n===cur?"selected":""}>${esc(n)}</option>`).join("");
  $("#chips").innerHTML=names.map(n=>`<span class="chip" data-o="${esc(n)}">${esc(n)} <b>${cnt[n]}</b></span>`).join("");
  $("#tb").innerHTML=v.map(r=>`<tr>
    <td class="mute">${r.i}</td><td>${esc(r.oblast)||'<span class="mute">—</span>'}</td><td class="${r.exact?"":"ap"}">${esc(cityText(r))}</td>
    <td>${r.path?`<img loading="lazy" src="${photo(r.path,true)}" data-full="${photo(r.path)}" alt="">`:'<span class="mute">—</span>'}</td>
    <td>${esc(r.fact)||'<span class="mute">—</span>'}</td>
    <td class="mute">${r.lat.toFixed(4)}, ${r.lon.toFixed(4)}</td></tr>`).join("");
  document.querySelectorAll("th[data-k]").forEach(th=>{
    th.classList.toggle("s",th.dataset.k===sortK);th.classList.toggle("d",th.dataset.k===sortK&&sortD)});
}
function table(){return view().map(r=>({"№":r.i,"Область":r.oblast,"Населений пункт":cityText(r),
  "Факт":r.fact,"Фото (посилання)":r.path?photo(r.path):"","Широта":+r.lat.toFixed(5),"Довгота":+r.lon.toFixed(5)}))}
function dl(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click()}

$("#fo").onchange=e=>{oblastPick=e.target.value==="(невизначено)"?"":e.target.value;render()};
$("#chips").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;oblastPick=c.dataset.o==="(невизначено)"?"":c.dataset.o;$("#fo").value=oblastPick;render()};
["fq","fp","ff"].forEach(id=>$("#"+id).oninput=render);
document.querySelector("thead").onclick=e=>{const k=e.target.dataset.k;if(!k)return;sortD=sortK===k?!sortD:false;sortK=k;render()};
$("#rf").onclick=()=>load().catch(e=>$("#st").textContent="Помилка: "+e.message);
$("#xl").onclick=()=>{const ws=XLSX.utils.json_to_sheet(table());ws["!cols"]=[{wch:5},{wch:24},{wch:24},{wch:60},{wch:50},{wch:10},{wch:10}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Піни");XLSX.writeFile(wb,"karta-pins.xlsx")};
$("#cv").onclick=()=>{const t=table(),h=Object.keys(t[0]||{});
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const csv="\ufeff"+[h.map(q).join(";")].concat(t.map(r=>h.map(k=>q(r[k])).join(";"))).join("\n");
  dl(new Blob([csv],{type:"text/csv;charset=utf-8"}),"karta-pins.csv")};
$("#tb").onclick=e=>{if(e.target.dataset.full){$("#lb img").src=e.target.dataset.full;$("#lb").style.display="flex"}};
$("#lb").onclick=()=>$("#lb").style.display="none";

// якщо сховище браузера недоступне (локальний файл, вбудований переглядач) — тримаємо сесію в пам'яті
let store;try{localStorage.setItem("t","1");localStorage.removeItem("t");store=undefined}catch(e){
  const m={};store={getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=v},removeItem:k=>{delete m[k]}}}
if(location.protocol==="file:")$("#st").textContent="Увага: сторінка відкрита як файл — краще відкрити її за посиланням з сайту. Завантаження…";
sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,store?{auth:{storage:store,persistSession:false}}:undefined);
load().catch(e=>{console.error(e);$("#st").textContent="Не вдалося завантажити дані: "+e.message});
</script>
</body>
</html>
